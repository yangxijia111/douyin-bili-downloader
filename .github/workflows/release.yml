name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PY_VERSION" ]; then
            echo "tag v$TAG 与 pyproject version $PY_VERSION 不一致" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .[channels,server,dev]
          pytest -q

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      # 生成草稿 Release（不自动发布）；Release Notes 由维护者按 CHANGELOG.md 填写
      # 后手动 publish，保证发布内容经过人工确认。
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
