name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ----------------------------------------------------------------------
  # 核心矩阵：全部支持版本 × 双系统。只装 [dev]（无 fastapi / mitmproxy），
  # server / channels 相关测试文件自带 importorskip 会自动跳过。
  # ----------------------------------------------------------------------
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check .
      - name: Core tests
        run: pytest -q
      - name: Package smoke (core modules)
        run: python scripts/ci_smoke.py cli core bilibili ytdlp

  # ----------------------------------------------------------------------
  # 视频号 / Server 矩阵：仅 Python 3.10+（mitmproxy 10+ 要求）。
  # 测试全程 mock 系统证书存储与系统代理，CI 不会修改真实系统状态。
  # ----------------------------------------------------------------------
  channels-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + channels + server + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[channels,server,dev]
      # 装齐 server + channels 后跑全量：覆盖 core 矩阵因缺 fastapi 而跳过
      # 的集成测试（test_bili_integration / test_lvdetail_gate /
      # test_ytdlp_integration / test_download_proxy_passthrough /
      # test_proxy_validator_parity）。测试全程 mock 系统状态。
      - name: Full tests (floating versions)
        run: pytest -q
      # 视频号页面注入包的前端单测（hook 语义保持 / objectDesc 收集 /
      # 按钮模型 / 运行时包装）。bash 保证 glob 在 Windows runner 上也展开。
      - name: Frontend tests (node --test)
        shell: bash
        run: node --test tests/frontend/*.test.js
      - name: Package smoke (all modules)
        run: python scripts/ci_smoke.py

  # ----------------------------------------------------------------------
  # 锁定版本矩阵：requirements.lock 的可复现验证。
  # lock 是 Python 3.13 解释器的完整快照（mitmproxy 对 typing-extensions
  # 的上界仅在 <3.13 生效，快照里的 typing_extensions 只与 3.13 自洽），
  # 因此锁定作业必须在 3.13 上运行；3.9-3.12 由 core 矩阵用范围声明验证。
  # ----------------------------------------------------------------------
  pinned:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install from requirements.lock
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .[channels,server,dev]
      - name: Full tests (locked versions)
        run: pytest -q

  # ----------------------------------------------------------------------
  # 构建门禁：sdist + wheel 必须可构建。
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
