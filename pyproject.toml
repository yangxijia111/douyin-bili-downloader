[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-downloader"
version = "2.0.2"
description = "Multi-platform video batch downloader (Douyin / Bilibili / WeChat Channels / iQIYI / Tencent Video / Youku etc.) with CLI and Web console"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "aiohttp>=3.9.0",
    # storage/file_manager.py imports httpx at runtime; keep in sync with
    # requirements.txt or clean-room sidecar builds crash at boot.
    "httpx>=0.25",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.19.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "gmssl>=3.2.2",
    # Bundled ffmpeg static binary used by core/audio_extraction.py to
    # extract audio tracks before uploading to the OpenAI-compatible
    # transcription endpoint. Pinned exact so the sidecar builds are
    # reproducible across CI machines. 0.6.0 is the first release that
    # ships a native macOS arm64 wheel; older versions only shipped
    # x86_64 macOS binaries.
    "imageio-ffmpeg==0.6.0",
    # Engine behind ytdlp/ (iQIYI / Tencent Video / Youku / Mango TV / Kuaishou /
    # Xigua / Toutiao / Weibo / Xiaohongshu). Extractors live upstream, so bump
    # with `pip install -U yt-dlp` whenever a site changes.
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
channels = [
    # 视频号嗅探引擎（channels/）。mitmproxy 10+ 要求 Python 3.10+；
    # 3.9 环境装不上该 extra，嗅探功能不可用（其余平台不受影响）。
    # 上界 <13：mitmproxy 大版本升级曾改变内部 API（allow_hosts / addon
    # 事件），大版本升级需先过 tests/test_channels_* 再放开。
    "mitmproxy>=10.1,<13; python_version >= '3.10'",
]
transcribe = [
    "openai-whisper>=20231117",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "httpx>=0.25",
    # Property-based tests (tests/test_database_top_authors.py,
    # test_notifier_redactor_property.py, test_proxy_validator_parity.py).
    # Missing hypothesis caused 3 collection errors pre-fix.
    "hypothesis>=6.0",
    # tests/test_dependency_consistency.py 在 Python 3.9/3.10 上读 pyproject。
    "tomli>=1.1; python_version < '3.11'",
]
all = [
    "douyin-downloader[browser,channels,transcribe,server,dev]",
]

[project.scripts]
douyin-dl = "cli.main:main"

[tool.setuptools.packages.find]
include = [
  "cli*",
  "core*",
  "auth*",
  "bilibili*",
  "channels*",
  "ytdlp*",
  "config*",
  "control*",
  "storage*",
  "utils*",
  "tools*",
  "server*",
]

# 视频号页面注入包的前端资源（JS / CSS 必须随 wheel 分发，
# virtual_host 的 /__cuin/assets/* 从包内读取）。
[tool.setuptools.package-data]
channels = ["inject/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# aiosqlite's background worker thread occasionally outlives the test's
# event loop (TestClient's lifespan tears down the loop immediately after
# shutdown, but the worker may wake one more time to `call_soon_threadsafe`
# and hit `RuntimeError: Event loop is closed`). This is a known upstream
# aiosqlite/pytest-asyncio interaction, not our bug — the connection is
# already closed cleanly at the contract level. Mirrors desktop's config
# so `pytest tests/` output is clean in both projects.
filterwarnings = [
  "ignore:Exception in thread Thread-.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
