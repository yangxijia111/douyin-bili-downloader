link:
  - https://www.douyin.com/user/MS4wLjABAAAA6O7EZyfDRYXxJrUTpf91K3tmB4rBROkAw-nYMfld8ss

path: ./Downloaded/

# 是否下载视频文件；关闭后仍可按下方开关保存原始封面、音乐、头像或 JSON。
# 默认只保存视频本体，其余附带产物按需打开。
video: true
music: false
cover: false
avatar: false
json: false

start_time: ""
end_time: ""

folderstyle: true

# 文件/目录命名模板。可用变量：
#   {id} {title} {author} {author_id} {date} {year} {month} {day}
#   {time} {timestamp} {type} {mode}
# 要求模板中至少包含 {id} 以避免重名覆盖。
filename_template: "{date}_{title}_{id}"
folder_template: "{date}_{title}_{id}"

# 作者目录层命名方式。可选值：
#   nickname     - 仅作者昵称（默认，最直观，但重名会合并、改名会分裂）
#   sec_uid      - 作者 sec_uid（稳定唯一，但不直观）
#   nickname_uid - 昵称_sec_uid（直观 + 唯一，推荐重度用户）
# 切换只影响后续下载，不会迁移已存在的目录。
author_dir: "nickname"

# 默认不下载作者主页置顶作品；如需包含置顶，改为 true
download_pinned: false

# 下载博主作品时，在作者根目录覆盖保存主页地址文本
author_url: false

# 下载博主作品时，在作者根目录覆盖保存一张主页首屏截图
homepage_screenshot: false

mode:
  - post

number:
  post: 1
  like: 0
  allmix: 0
  mix: 0
  music: 0
  collect: 0
  collectmix: 0

# 增量任务的磁盘主文件缺失时是否重新下载：
# true  保持当前行为，文件缺失或为空时重新下载；
# false 数据库仍有有效下载记录时跳过（数据库不可用或记录已删除时仍会下载）。
redownload_missing_files: true

# 各模式是否启用增量下载：true 跳过已判定为下载过的作品；
# false 重新下载并覆盖当前筛选范围内的作品。
increase:
  post: true
  like: true
  allmix: true
  mix: true
  music: true

thread: 5
retry_times: 3
proxy: ""
database: true
database_path: dy_downloader.db

# 视频下载画质。抖音 API 为每个视频返回多档码率，此选项决定选用哪一档：
#   original                 - 原画：探测上传原片（转码档列表之外，可比最高
#                              转码档大数倍），比转码档大则优先下载原片，探测
#                              失败时退回最高转码档。代价是每条作品多一次探测
#                              请求（超时 10s）
#   highest                  - 最高转码档（默认）：只在 bit_rate 阶梯里挑，
#                              不发探测请求
#   lowest                   - 最低可用档（省流量）
#   1440p / 1080p / 720p / 540p / 480p / 360p
#                            - 指定分辨率，匹配不到时自动降级到最接近的可用档
# 实际可用档位取决于原视频上传质量。
video_quality: highest

progress:
  quiet_logs: true

transcript:
  enabled: false
  model: gpt-4o-mini-transcribe
  output_dir: ""
  response_formats:
    - txt
    - json
  api_url: https://api.openai.com/v1/audio/transcriptions
  api_key_env: OPENAI_API_KEY
  api_key: ""

browser_fallback:
  enabled: true
  headless: false
  max_scrolls: 240
  idle_rounds: 8
  wait_timeout_seconds: 600

# 评论采集（可选）：启用后每个作品会额外生成 *_comments.json
comments:
  enabled: false
  include_replies: false
  max_comments: 0   # 0 = 不限
  page_size: 20

# 直播录制（可选）：当 link 指向 live.douyin.com/{room_id} 或 /follow/live/{room_id} 时生效
live:
  max_duration_seconds: 0   # 0 = 录到主播下播
  chunk_size: 65536
  idle_timeout_seconds: 30

# 下载完成通知（可选）。providers 支持 bark / telegram / webhook
notifications:
  enabled: false
  on_success: true
  on_failure: true
  providers: []
  # 示例：
  # providers:
  #   - type: bark
  #     url: https://api.day.app/YOUR_DEVICE_KEY
  #     sound: bell
  #   - type: telegram
  #     bot_token: "123456:ABC..."
  #     chat_id: "987654321"
  #   - type: webhook
  #     url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
  #     extra_body:
  #       msgtype: text

# REST API 服务模式（可选，需额外安装 fastapi + uvicorn）
server:
  max_jobs: 500
  job_ttl_seconds: 86400   # 完成态 job 保留 24 小时

  # REST API 远程访问令牌。默认服务只监听 127.0.0.1，本机请求免认证；
  # 一旦用 --serve-host 0.0.0.0 / 局域网 IP / :: 对外开放，远程客户端必须
  # 携带 X-Auth-Token（或 Authorization: Bearer）访问 /api/*。
  # 留空 + 对外监听时：远程请求一律 403 拒绝（宁不可用，不裸奔）。
  # 也可用环境变量 DOWNLOADER_API_TOKEN 注入（优先级更高）。
  # 安全提示：不建议把 REST 服务暴露到公网；此键不可通过 HTTP API 修改。
  auth_token: ""

# ============================================================================
# 哔哩哔哩下载（可选）
# ----------------------------------------------------------------------------
# 触发方式：把 B 站链接混进上面的 link 列表即可，程序按域名自动分流。支持：
#   https://www.bilibili.com/video/BV1xx411c7mD         单稿件（多 P 自动全下）
#   https://www.bilibili.com/video/BV1xx411c7mD?p=3     只下第 3 P
#   BV1xx411c7mD / av170001                             裸 ID 直接粘贴
#   https://space.bilibili.com/271779326/video          UP 主全部投稿（批量）
#   https://space.bilibili.com/1/channel/collectiondetail?sid=123   合集
#   https://space.bilibili.com/1/channel/seriesdetail?sid=123       系列
#   https://space.bilibili.com/1/favlist?fid=123         收藏夹（需登录）
#   https://b23.tv/xxxxxx                              站内短链（自动展开）
#
# 抖音侧的大部分配置对 B 站同样生效：path、thread、retry_times、proxy、
# start_time / end_time、filename_template / folder_template、folderstyle、
# author_dir、group_by_mode、database、notifications。
#
# 输出目录结构与抖音一致，按来源分模式层：
#   Downloaded/{UP主}/post/2026-01-01_标题_BV1xx411c7mD/...
#   Downloaded/{UP主}/collection/{合集名}/...        （合集 / 系列各自成层）
#   Downloaded/{UP主}/favlist/{收藏夹名}/...          （收藏夹内稿件 UP 主各异，
#                                                     作者目录仍是稿件真实 UP 主）
bilibili:
  enabled: true

  # 登录凭据。SESSDATA 是唯一必需项：
  #   - 未登录：清晰度上限 480P，收藏夹接口直接返回 -101 不可用；
  #   - 登录：1080P；
  #   - 大会员登录：1080P+ / 4K / 8K / HDR / 杜比视界 / 无损音频。
  # 获取方式：浏览器登录 bilibili.com → F12 → Application → Cookies →
  # https://www.bilibili.com → 复制 SESSDATA 的值。
  # 两种等价写法，二选一即可（cookies 字典优先级更高）：
  #   cookie: "SESSDATA=xxxxxxxx; bili_jct=yyyyyyyy"
  cookies:
    SESSDATA: ""
    bili_jct: ""
    # buvid3 留空会自动向 B 站领取，一般无需手填。

  # 画质偏好。可选值：
  #   highest   最高可用档（默认，实际上限由账号权限决定）
  #   lowest    最低档（省流量）
  #   8k / dolby / hdr / 4k / 1080p60 / 1080p+ / 1080p / 720p60 / 720p /
  #   480p / 360p / 240p
  # 指定档位不可用时自动降级到最接近的可用档。
  quality: highest

  # 音频轨偏好：highest（无损 FLAC / 杜比 / 192K 优先）或 lowest。
  audio_quality: highest

  # 视频编码偏好：auto（avc→hevc→av1 兼容性优先）/ avc / hevc / av1。
  # 指定的编码在该稿件不存在时自动退回可用编码，不会失败。
  codec: auto

  # 只下载音频轨，保存为 .m4a。适合当播客 / 音乐收藏用。
  audio_only: false

  # 附带产物开关（默认全关，与抖音侧「只拿主媒体」的策略一致）：
  #   download_cover     封面 {stem}_cover.jpg
  #   download_subtitle  字幕 {stem}.{语言}.srt（含 AI 字幕，需登录）
  #   download_danmaku   弹幕 {stem}.danmaku.xml
  #   download_json      接口原始数据 {stem}_data.json
  download_cover: false
  download_subtitle: false
  download_danmaku: false
  download_json: false

  # UP 主投稿排序：pubdate（最新发布）/ click（最多播放）/ stow（最多收藏）。
  # pubdate 下会启用时间下界提前收敛，增量任务只需翻到新稿件所在页。
  user_order: pubdate

  # 接口之间的最小请求间隔（秒）。B 站风控对同账号高频请求敏感，不建议调小。
  request_interval: 0.5

  # ffmpeg 路径。DASH 音视频合并依赖 ffmpeg；留空时用打包内置的静态二进制，
  # 其次搜索系统 PATH。
  ffmpeg_path: ""

  # 各链接类型的数量上限，0 = 不限。
  number:
    video: 0
    user: 0
    collection: 0
    series: 0
    favlist: 0

  # 各链接类型是否启用磁盘增量。按 bvid 判定；多 P 稿件按分 P 粒度补齐，
  # 例如上次只下到第 1 P，重跑会补下第 2 P 起的内容。
  increase:
    video: true
    user: true
    collection: true
    series: true
    favlist: true

# ============================================================================
# 其他知名视频平台（可选，yt-dlp 引擎）
# ----------------------------------------------------------------------------
# 触发方式：把链接混进上面的 link 列表即可，程序按域名自动分流。需要先安装
# yt-dlp：`pip install yt-dlp`（已包含在 requirements.txt 中）。首批支持：
#   爱奇艺     https://www.iqiyi.com/v_xxxxx.html
#   腾讯视频   https://v.qq.com/x/cover/xxx/yyy.html
#   优酷       https://v.youku.com/v_show/id_xxx.html
#   芒果 TV    https://www.mgtv.com/b/xxx/yyy.html
#   快手       https://www.kuaishou.com/short-video/xxx  或  v.kuaishou.com 短链
#   西瓜视频   https://www.ixigua.com/xxx
#   今日头条   https://www.toutiao.com/video/xxx
#   微博       https://weibo.com/tv/show/xxx
#   小红书     https://www.xiaohongshu.com/explore/xxx  或  xhslink.com 短链
# 剧集页 / 列表页会自动展开成多条，受 number.video 截断。
#
# 能力边界（务必了解）：
#   - VIP 专享内容受 DRM（ChinaDRM / Widevine）保护，任何工具都无法直接下载，
#     即使配置了会员 Cookie 也不行；
#   - 免费内容、试看片段、以及登录后可看的非 DRM 内容可以下载；
#   - 配置对应平台的 Cookie 通常能解锁更高清晰度（如爱奇艺未登录只有 480P）。
#
# 各平台实测状态（yt-dlp 2026.08.19，站方改版后可能变化）：
#   - 腾讯视频 / 微博 / 今日头条：免登录可直接下载；
#   - 西瓜视频：需要配置 Cookie（无需登录，但站方要求带 Cookie）；
#   - 爱奇艺大陆站 iqiyi.com：yt-dlp 解析器上游当前失效（网页模板已改），
#     待上游修复后 `pip install -U yt-dlp` 即可；国际站 iq.com 可用但需要
#     安装 PhantomJS（https://phantomjs.org/download.html）并放入 PATH；
#   - 快手：yt-dlp 没有专用解析器，属尽力而为。
#
# 抖音侧的大部分配置对这些平台同样生效：path、thread、retry_times、proxy、
# filename_template / folder_template、folderstyle、author_dir、group_by_mode、
# database、redownload_missing_files。
#
# 输出目录结构：Downloaded/{作者或平台名}/{平台键}/2026-01-01_标题_iqiyi_123/...
ytdlp:
  enabled: true

  # 按平台单独开关；缺省视为开启。键名：
  #   iqiyi / tencent / youku / mgtv / kuaishou / xigua / toutiao / weibo / xiaohongshu
  platforms: {}
  #   iqiyi: true
  #   tencent: false

  # 按平台配置登录 Cookie。浏览器登录后 F12 → Network → 任意请求 → 请求头
  # 里的 Cookie 整段复制。字符串与字典两种写法都可以：
  cookies: {}
  #   iqiyi: "P00001=xxx; QC005=yyy; ..."
  #   tencent:
  #     vqq_vuserid: xxx
  #     vqq_access_token: yyy

  # 或者直接指定浏览器插件（如 Get cookies.txt LOCALLY）导出的 Netscape 格式
  # cookies.txt，对所有平台生效，优先级高于上面的 cookies。
  # 也可用环境变量 YTDLP_COOKIE_FILE 指定。
  cookie_file: ""

  # 画质偏好：highest / lowest / 4k / 2k / 1080p / 720p / 480p / 360p。
  # 指定档位不可用时自动降级；实际上限由账号权限与站方策略决定。
  quality: highest

  # 只下载音频轨，保存为 .m4a。
  audio_only: false

  # 附带产物开关（默认全关）：
  #   download_cover     封面图
  #   download_subtitle  中文字幕（站方提供时）
  #   download_json      yt-dlp 的原始信息 {stem}.info.json
  download_cover: false
  download_subtitle: false
  download_json: false

  # ffmpeg 路径。分离音视频轨的站点合并依赖 ffmpeg；留空时用打包内置的静态
  # 二进制，其次搜索系统 PATH。
  ffmpeg_path: ""

  # 逃生舱：透传给 yt-dlp 的额外选项（键名同 yt-dlp Python API），走白名单
  # 分级（见 ytdlp/options_policy.py）：
  #   * 默认只放行无本地副作用的网络/性能参数（geo_bypass、http_headers、
  #     socket_timeout、limit_rate 等）；
  #   * outtmpl / exec_cmd / external_downloader / cookiefile / proxy 等
  #     「可写任意文件 / 执行命令 / 调本机可执行文件」的危险参数必须显式
  #     打开 unsafe_extra_options 才生效；
  #   * 未知参数一律报错拒绝；批次里有一个被拒则整个批次不生效。
  # 此段与 unsafe_extra_options 都不能通过 Web API 的 overrides 传入。
  extra_options: {}
  #   geo_bypass: true
  #   http_headers:
  #     User-Agent: "Mozilla/5.0 ..."
  unsafe_extra_options: false

  # 数量上限，0 = 不限。剧集页 / 列表页展开后按此截断。
  number:
    video: 0

  # 磁盘增量：按 <平台>_<视频ID> 判定，已存在的跳过。
  increase:
    video: true

# ---------------------------------------------------------------------------
# 微信视频号（嗅探下载）
#
# 视频号没有免登录网页版：登录态只存在于本机微信客户端的内嵌浏览器里，
# 所以这里的形态是「嗅探」——启动本机 MITM 代理（需要 mitmproxy：
# pip install ".[channels]"），被动读取微信流量中的视频直链与 ISAAC64
# 解密密钥（decodeKey 随接口明文下发），捕获后下载。首次使用需在弹出的
# Windows 确认框里信任本机生成的根证书（每机唯一，存于 ~/.mitmproxy）。
#
# 用法：python run.py --channels（或网页控制台「视频号」页启动嗅探），
# 然后在本机微信里打开视频号刷视频即可自动捕获下载。方案参考
# ltaoo/wx_channels_download，但不注入微信页面，对微信前端改版零依赖。
# ---------------------------------------------------------------------------
channels:
  # 嗅探功能开关。
  enabled: true

  # 捕获到新视频后是否自动下载；false 时只进列表，网页/CLI 里手动挑选。
  auto_download: true

  # 画质偏好：highest / lowest / 1080p / 720p / 480p …，匹配不到自动回退
  # 到微信下发版本。
  quality: highest

  # 本机嗅探代理端口（换端口需重启嗅探会话）。
  proxy_port: 8899

  # 自动模式下是否录制正在直播的 FLV 流（时长无上界，默认关；
  # 列表里可随时手动开始录制）。直播回放是普通加密视频，自动捕获下载。
  live_record: false

  # 附带下载封面图。
  download_cover: false

  # 增量下载：按 channels_<作品ID> 判重，磁盘已有即跳过。
  increase: true

  # MITM 解密白名单扩展。默认只解密 weixin.qq.com 的子域（视频号 API 所在
  # 域）；其余全部流量（QQ 其它子域、CDN、无关网站）直接隧道转发不解密。
  # 一般无需修改；确有新的必需域名时先在 channels/domains.py 补充依据。
  # 注意：这是「允许解密的域」白名单，不要写成 .qq.com 这类宽后缀。
  # intercept_domains: []

cookies:
  msToken: YOUR_MS_TOKEN
  ttwid: YOUR_TTWID
  odin_tt: YOUR_ODIN_TT
  passport_csrf_token: YOUR_CSRF_TOKEN
  sid_guard: YOUR_SID_GUARD
