# requirements.lock —— 锁定到已验证版本的完整依赖快照（含传递依赖与 dev/server/channels 工具）。
#
# 版本策略（勿盲目全锁 / 勿盲目全放）：
#   * 普通用户安装：走 pyproject.toml / requirements.txt 的**范围声明**——
#     yt-dlp 刻意不设上界，便于 `pip install -U yt-dlp` 跟进站方解析器更新；
#   * CI 复现：ci.yml 的 `pinned` 作业（Python 3.12）用本文件锁定安装，
#     验证整套测试在确定版本组合上通过；
#   * lock 里的部分 pin（aiohttp / fastapi / pytest / hypothesis 等）要求
#     Python >= 3.10，故锁定作业只在 3.12 上运行；
#   * 上游大版本升级后用下面命令重建：
#       .venv/Scripts/python.exe -m pip freeze --exclude-editable > requirements.lock
#     （或 POSIX：pip freeze --exclude-editable > requirements.lock）
#     重建后 tests/test_dependency_consistency.py 会校验 lock 与 pyproject 的约束一致。

